name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (monorepo)
        run: bun run typecheck

      - name: Lint (Biome, non-blocking)
        run: bun x biome check --diagnostic-level=error || true

      - name: Tests (matcher suite)
        run: bun test

      - name: Build
        run: bun run build
